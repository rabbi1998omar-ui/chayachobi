<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ছায়াছবি</title>

<style>
body{
  margin:0;
  background:#0b0b0b;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

.header{
  padding:35px 20px;
  background:linear-gradient(135deg,#111,#292929);
}

h1{
  font-size:38px;
  margin:0;
}

.subtitle{
  color:#aaa;
}

.box{
  margin:25px 18px;
  padding:25px 15px;
  background:#151515;
  border:1px solid #333;
  border-radius:20px;
}

input{
  display:none;
}

.upload{
  display:inline-block;
  padding:15px 25px;
  background:white;
  color:black;
  border-radius:30px;
  font-weight:bold;
  cursor:pointer;
}

#preview{
  max-width:100%;
  margin-top:20px;
  border-radius:15px;
  display:none;
}

footer{
  margin-top:40px;
  color:#777;
}
</style>
</head>

<body>

<div class="header">
  <h1>🎬 ছায়াছবি</h1>
  <p class="subtitle">তোমার গল্প, তোমার স্মৃতি</p>
</div>

<div class="box">

  <h2>📸 ছবি যোগ করুন</h2>

  <p>তোমার প্রিয় ছবিটি নির্বাচন করো</p>

  <label class="upload" for="photo">
    📷 ছবি নির্বাচন
  </label>

  <input
    type="file"
    id="photo"
    accept="image/*"
    onchange="showPhoto(event)"
  >

  <img id="preview">
<br><br>

<button onclick="cinematic()">
  🎬 Cinematic
</button>
</div>

<footer>
  © 2026 ছায়াছবি
</footer>
function cinematic(){

  const image = document.getElementById("preview");

  image.style.filter =
    "contrast(1.15) brightness(0.85) saturate(0.85)";

}
<script>
function showPhoto(event){

  const image = document.getElementById("preview");

  image.src = URL.createObjectURL(event.target.files[0]);

  image.style.display = "block";
}
</script>

</body>
</html>
