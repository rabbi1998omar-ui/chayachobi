<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>ছায়াছবি</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  background:#05070a;
  color:#fff;
  font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif
}

body{overflow:hidden}

.app{
  height:100vh;
  position:relative;
  background:#05070a
}

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:5;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:linear-gradient(#05070add,transparent)
}

.logo{
  font-size:24px;
  font-weight:900
}

.tabs{
  font-size:13px;
  opacity:.8
}

.tabs b{
  color:#fff;
  border-bottom:2px solid #ff2638;
  padding-bottom:7px;
  margin-right:15px
}

.feed{
  height:100%;
  overflow-y:auto;
  scroll-snap-type:y mandatory
}

.card{
  height:100vh;
  position:relative;
  scroll-snap-align:start;
  display:flex;
  align-items:flex-end;
  background-size:cover;
  background-position:center
}

.card:nth-child(1){
  background:radial-gradient(circle at 75% 25%,#47546c,transparent 30%),linear-gradient(145deg,#17202d,#07090d 60%,#321017)
}

.card:nth-child(2){
  background:radial-gradient(circle at 35% 30%,#8c654e,transparent 28%),linear-gradient(145deg,#303b46,#090b0f 65%,#1c1112)
}

.card:nth-child(3){
  background:radial-gradient(circle at 70% 30%,#314b55,transparent 32%),linear-gradient(145deg,#111e25,#050608 70%,#1c2428)
}

.scene{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:.55
}

.scene span{
  font-size:110px;
  filter:drop-shadow(0 8px 25px #000)
}

.fade{
  position:absolute;
  inset:0;
  background:linear-gradient(transparent 45%,#000d 70%,#000 100%)
}

.info{
  position:relative;
  z-index:2;
  padding:0 88px 86px 16px;
  width:100%
}

.user{
  font-weight:800;
  font-size:16px
}

.desc{
  font-size:14px;
  line-height:1.45;
  margin:8px 0
}

.music{
  font-size:12px;
  opacity:.8
}

.actions{
  position:absolute;
  right:12px;
  bottom:88px;
  z-index:3;
  display:flex;
  flex-direction:column;
  gap:18px;
  align-items:center
}

.action{
  width:52px;
  text-align:center;
  font-size:11px
}

.ico{
  width:48px;
  height:48px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#101318cc;
  border:1px solid #ffffff22;
  font-size:23px
}

.action.liked .ico{
  color:#ff2638
}

.avatar{
  width:46px;
  height:46px;
  border-radius:50%;
  background:linear-gradient(135deg,#ff2638,#5d1620);
  border:2px solid white;
  display:grid;
  place-items:center;
  font-weight:800
}

.nav{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:#05070af5;
  border-top:1px solid #ffffff10;
  z-index:10;
  display:flex;
  justify-content:space-around;
  align-items:center
}

.nav button{
  border:0;
  background:none;
  color:#89909b;
  font-size:11px
}

.nav button b{
  display:block;
  font-size:21px
}

.nav button.active{
  color:#fff
}

.plus{
  background:#ff2638!important;
  color:#fff!important;
  width:48px;
  height:40px;
  border-radius:12px;
  font-size:25px!important
}

.panel{
  position:absolute;
  inset:0;
  z-index:20;
  background:#07090cf8;
  display:none;
  overflow:auto;
  padding:25px 18px 90px
}

.panel.show{
  display:block
}

.back{
  background:none;
  border:0;
  color:#fff;
  font-size:25px
}

.title{
  font-size:24px;
  font-weight:900;
  margin:18px 0
}

.field{
  min-height:50px;
  border:1px solid #ffffff18;
  border-radius:14px;
  background:#101318;
  padding:14px 15px;
  color:#fff;
  display:flex;
  align-items:center;
  margin:10px 0
}

.textarea{
  width:100%;
  min-height:90px;
  resize:none;
  outline:none;
  font-family:inherit
}

.btn{
  min-height:50px;
  border:0;
  border-radius:14px;
  background:#ff2638;
  color:#fff;
  font-weight:800;
  width:100%;
  font-size:15px;
  margin-top:8px
}

.uploadbox{
  height:150px;
  border:1px dashed #66707d;
  border-radius:18px;
  display:grid;
  place-items:center;
  text-align:center;
  margin:18px 0;
  cursor:pointer
}

.preview{
  display:none;
  position:relative;
  margin:15px 0;
  border-radius:18px;
  overflow:hidden;
  background:#101318;
  border:1px solid #ffffff15
}

.preview img{
  width:100%;
  display:block;
  max-height:420px;
  object-fit:contain
}

.previewText{
  position:absolute;
  left:10px;
  right:10px;
  bottom:25px;
  text-align:center;
  font-weight:900;
  text-shadow:0 3px 10px #000;
  pointer-events:none;
  white-space:pre-wrap;
  word-break:break-word
}

.filter-title{
  font-weight:800;
  margin-top:18px
}

.filters{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin:10px 0 18px
}

.filters button{
  height:44px;
  border:1px solid #ffffff22;
  border-radius:10px;
  background:#15191f;
  color:#fff;
  font-size:11px
}

.filters button.active{
  background:#ff2638;
  border-color:#ff2638
}

.control{
  margin:14px 0
}

.controlTop{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  margin-bottom:6px
}

.control input[type=range]{
  width:100%
}

.colorRow{
  display:flex;
  gap:10px;
  align-items:center
}

.colorRow input{
  width:55px;
  height:45px;
  border:0;
  padding:0;
  background:none
}

.profileHead{
  text-align:center;
  padding-top:30px
}

.avatar.big{
  margin:auto;
  width:88px;
  height:88px;
  font-size:30px
}

.stats{
  display:flex;
  justify-content:space-around;
  margin:25px 0
}

.stat b{
  display:block;
  font-size:20px
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:3px
}

.tile{
  height:150px;
  background:linear-gradient(145deg,#26313b,#0c0f13);
  display:grid;
  place-items:center;
  font-size:34px
}

.row{
  padding:16px 4px;
  border-bottom:1px solid #ffffff10;
  display:flex;
  justify-content:space-between
}

.muted{
  color:#88909a;
  font-size:13px
}

.smallNote{
  color:#8e96a3;
  font-size:12px;
  line-height:1.5;
  margin-top:10px
}
</style>
</head>

<body>

<div class="app">

<header class="top">
  <div class="logo">ছায়াছবি•</div>
  <div class="tabs">
    <b>ফলোয়িং</b> আপনার জন্য
  </div>
</header>

<main class="feed" id="feed">

<section class="card">
  <div class="scene"><span>🎬</span></div>

  <div class="info">

    <div class="desc">

      #ছায়াছবি #cinematic #foryou
    </div>
    <div class="music">♫ Original sound — ছায়াছবি</div>
  </div>

  <div class="actions">
    <div class="avatar">R</div>
    <div class="action like">
      <div class="ico">♡</div>

      <span>342</span>
    </div>
    <div class="action">
      <div class="ico">↗</div>
      <span>1.2K</span>
    </div>
  </div>
</section>

  <div class="scene"><span>🌅</span></div>
  <div class="fade"></div>

  <div class="info">
    <div class="user">@sad_love</div>
