<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ছায়াছবি</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0b;
      color: white;
      text-align: center;
    }

    .header {
      padding: 35px 20px;
      background: linear-gradient(135deg, #111, #242424);
    }

    h1 {
      font-size: 38px;
      margin: 0;
    }

    .subtitle {
      color: #aaa;
      margin-top: 10px;
    }

    .box {
      margin: 30px 20px;
      padding: 30px 20px;
      border: 1px solid #333;
      border-radius: 20px;
      background: #151515;
    }

    button {
      border: none;
      padding: 15px 25px;
      border-radius: 30px;
      background: white;
      color: black;
      font-size: 16px;
      font-weight: bold;
    }

    button:active {
      transform: scale(0.96);
    }

    footer {
      margin-top: 50px;
      padding: 20px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>🎬 ছায়াছবি</h1>
    <p class="subtitle">তোমার গল্প, তোমার স্মৃতি</p>
  </div>

  <div class="box">
    <h2>📸 তোমার ছবি</h2>
    <p>তোমার প্রিয় মুহূর্তগুলো এখানে সাজাও</p>

    <button onclick="alert('ছায়াছবিতে স্বাগতম ❤️')">
      শুরু করি
    </button>
  </div>

  <footer>
    © 2026 ছায়াছবি
  </footer>

</body>
</html>
